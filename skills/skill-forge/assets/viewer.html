<!-- Derived from Anthropic skill-creator (Apache-2.0); modified for OMP. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skill evaluation review</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #20252c;
        background: #f4f5f7;
      }
      body {
        max-width: 1250px;
        margin: 24px auto;
        padding: 0 24px;
      }
      button,
      a.download {
        padding: 8px 12px;
        border: 1px solid #aab2bd;
        border-radius: 6px;
        background: white;
        color: #173d79;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      nav {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      section,
      .card {
        padding: 18px;
        background: white;
        border: 1px solid #dce0e6;
        border-radius: 8px;
        margin: 14px 0;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 120px;
        padding: 12px;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f6f7f9;
        padding: 12px;
        max-height: 650px;
        overflow: auto;
      }
      img {
        max-width: 100%;
        max-height: 700px;
      }
      iframe {
        width: 100%;
        height: 650px;
        border: 1px solid #ddd;
      }
      .warning {
        color: #922600;
        background: #fff2db;
        padding: 12px;
      }
      .badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .badge {
        border-radius: 6px;
        padding: 6px 10px;
        background: #edf1f8;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        overflow: auto;
        display: block;
      }
      td,
      th {
        text-align: left;
        padding: 9px;
        border-bottom: 1px solid #ddd;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      small {
        color: #536071;
      }
      [hidden] {
        display: none !important;
      }
      .ok {
        color: #16653b;
      }
      .error {
        color: #a21e1e;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p>
      Review the actual artifacts, evidence, and transcript. Empty feedback is approval only after
      you have visited that run.
    </p>
    <nav>
      <button id="reviewTab">Runs</button><button id="benchmarkTab">Benchmark</button
      ><span id="saveStatus" role="status"></span>
    </nav>
    <div id="review">
      <nav>
        <button id="prev">Previous</button><span id="position"></span><button id="next">Next</button
        ><select id="runSelect" aria-label="Select run"></select>
      </nav>
      <div id="runView"></div>
      <section>
        <label for="feedback"><strong>Your feedback</strong></label
        ><textarea
          id="feedback"
          placeholder="What should change? Leave empty if this reviewed run is satisfactory."
        ></textarea
        ><small id="visited"></small>
      </section>
      <nav>
        <button id="save">Save feedback</button><button id="download">Download feedback.json</button
        ><button id="complete">Finish review</button>
      </nav>
    </div>
    <div id="benchmark" hidden></div>
    <p id="done" hidden>Return to your OMP session and tell the agent you're done.</p>
    <script>
      const DATA = /*__DATA__*/;
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, parent) => {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (parent) parent.append(node);
        return node;
      };
      const fmt = (value) => (value === null || value === undefined ? "—" : String(value));
      const now = () => new Date().toISOString();
      let index = 0,
        timer = null,
        chain = Promise.resolve(),
        status = DATA.feedback.status === "complete" ? "complete" : "in_progress";
      const reviews = new Map((DATA.feedback.reviews || []).map((r) => [r.run_id, { ...r }]));
      for (const run of DATA.runs)
        if (!reviews.has(run.id))
          reviews.set(run.id, { run_id: run.id, feedback: "", visited: false, timestamp: now() });
      $("title").textContent = `${DATA.skill_name} — evaluation review`;
      function download(value, name) {
        const url = URL.createObjectURL(
          new Blob([JSON.stringify(value, null, 2) + "\n"], { type: "application/json" }),
        );
        const a = el("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function snapshot() {
        return {
          status,
          updated_at: now(),
          reviews: DATA.runs.map((r) => ({ ...reviews.get(r.id) })),
        };
      }
      function capture() {
        const run = DATA.runs[index];
        if (!run) return;
        const r = reviews.get(run.id);
        if (r.feedback !== $("feedback").value) {
          r.feedback = $("feedback").value;
          r.timestamp = now();
        }
      }
      function persist() {
        clearTimeout(timer);
        timer = null;
        capture();
        const payload = snapshot();
        chain = chain
          .catch(() => {})
          .then(async () => {
            if (DATA.static) {
              $("saveStatus").textContent =
                "Stored in this page; download feedback.json to persist.";
              return;
            }
            $("saveStatus").textContent = "Saving…";
            try {
              const response = await fetch("/api/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
              if (!response.ok)
                throw new Error(`HTTP ${response.status}: ${await response.text()}`);
              $("saveStatus").textContent = "Saved";
            } catch (error) {
              $("saveStatus").textContent =
                `Save failed: ${error.message}. Download feedback.json as a fallback.`;
              throw error;
            }
          });
        return chain;
      }
      function fileView(file, parent) {
        const card = el("section", undefined, parent);
        el("h3", file.name, card);
        if (file.note) el("p", file.note, card);
        if (file.download) {
          const link = el("a", "Download file", card);
          link.href = file.download;
          link.download = file.name.split("/").pop();
          link.className = "download";
        }
        if (file.type === "text") el("pre", file.content, card);
        else if (file.type === "image") {
          const image = el("img", undefined, card);
          image.src = file.data_uri;
          image.alt = file.name;
        } else if (file.type === "pdf") {
          const frame = el("iframe", undefined, card);
          frame.src = file.data_uri;
          frame.title = file.name;
        } else if (file.type === "xlsx") {
          const note = el(
            "p",
            "Spreadsheet preview is optional and requires the SheetJS CDN. The download always works.",
            card,
          );
          const button = el("button", "Load spreadsheet preview", card);
          button.onclick = async () => {
            button.disabled = true;
            try {
              if (!window.XLSX) {
                await new Promise((resolve, reject) => {
                  const script = el("script");
                  script.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
                  script.onload = resolve;
                  script.onerror = () => reject(new Error("CDN unavailable"));
                  document.head.append(script);
                });
              }
              const bytes = Uint8Array.from(atob(file.data_b64), (c) => c.charCodeAt(0));
              const book = XLSX.read(bytes, { type: "array" });
              for (const name of book.SheetNames) {
                el("h4", name, card);
                const table = el("table", undefined, card);
                for (const row of XLSX.utils.sheet_to_json(book.Sheets[name], {
                  header: 1,
                  raw: false,
                })) {
                  const tr = el("tr", undefined, table);
                  for (const cell of row) el("td", fmt(cell), tr);
                }
              }
              button.remove();
            } catch (error) {
              note.textContent = `Preview unavailable: ${error.message}. Download the file instead.`;
              button.disabled = false;
            }
          };
        }
      }
      function renderRunContext(run, parent) {
        el("h2", run.id, parent);
        el("p", `Eval: ${fmt(run.eval_name)} (${fmt(run.eval_id)}) · ${run.configuration}`, parent);
        const badges = el("div", undefined, parent);
        badges.className = "badges";
        for (const text of [
          `Outcome: ${fmt(run.run.outcome)}`,
          `Time: ${fmt(run.timing.total_duration_seconds)} s`,
          `Tokens: ${fmt(run.timing.total_tokens)}`,
          `Cost: ${fmt(run.timing.cost_usd)} USD`,
        ]) {
          el("span", text, badges).className = "badge";
        }
        if (run.run.contamination?.read_skill) {
          el(
            "p",
            run.configuration === "without_skill"
              ? "Warning: baseline contamination — the agent read the skill."
              : "Skill read observed (informational for this configuration).",
            parent,
          ).className = "warning";
        }
        if (run.run.error) el("pre", run.run.error, parent);
        el("h3", "Prompt", parent);
        el("pre", run.prompt, parent);
        if (run.expected_output) {
          el("h3", "Expected output", parent);
          el("pre", run.expected_output, parent);
        }
        if (run.assertions?.length) {
          el("h3", "Assertions", parent);
          const list = el("ul", undefined, parent);
          run.assertions.forEach((a) => el("li", a, list));
        }
      }

      function renderGrading(run, parent) {
        if (run.grading) {
          el("h3", `Grading — pass rate ${fmt(run.grading.summary?.pass_rate)}`, parent);
          for (const item of run.grading.expectations || []) {
            const card = el("div", undefined, parent);
            card.className = "card";
            el("strong", `${item.passed ? "PASS" : "FAIL"}: ${item.text}`, card);
            el("pre", item.evidence, card);
          }
          const extra = el("details", undefined, parent);
          el("summary", "Full grading details", extra);
          el("pre", JSON.stringify(run.grading, null, 2), extra);
        } else {
          el("p", "Ungraded: no pass rate available.", parent).className = "warning";
        }
      }

      function renderRunArtifacts(run, parent) {
        el("h3", "Outputs", parent);
        if (!run.outputs.length) el("p", "No output files.", parent);
        run.outputs.forEach((f) => fileView(f, parent));
        const transcript = el("details", undefined, parent);
        el("summary", "Transcript", transcript);
        el("pre", run.transcript, transcript);
        const old = DATA.previous[run.id];
        if (old) {
          const prior = el("details", undefined, parent);
          el("summary", "Previous iteration: outputs and feedback", prior);
          el("pre", old.feedback?.feedback || "No previous feedback.", prior);
          el("p", `Previously visited: ${fmt(old.feedback?.visited)}`, prior);
          old.outputs.forEach((f) => fileView(f, prior));
        }
      }

      function render() {
        const run = DATA.runs[index];
        $("runView").replaceChildren();
        $("position").textContent = DATA.runs.length
          ? `${index + 1} / ${DATA.runs.length}`
          : "No runs";
        $("prev").disabled = index === 0;
        $("next").disabled = index >= DATA.runs.length - 1;
        $("complete").disabled = !DATA.runs.length;
        $("runSelect").value = String(index);
        if (!run) return;
        const review = reviews.get(run.id);
        review.visited = true;
        review.timestamp = now();
        $("feedback").value = review.feedback;
        $("visited").textContent =
          "Visited — your review state is tracked separately from feedback.";
        const parent = $("runView");
        renderRunContext(run, parent);
        renderGrading(run, parent);
        renderRunArtifacts(run, parent);
        if (status === "complete") $("done").hidden = false;
      }
      let navigating = false;
      async function navigate(next) {
        if (navigating || next < 0 || next >= DATA.runs.length) return;
        navigating = true;
        clearTimeout(timer);
        capture();
        for (const id of ["feedback", "runSelect", "prev", "next", "complete"])
          $(id).disabled = true;
        try {
          await persist();
          index = next;
          render();
          await persist();
        } catch {
          $("runSelect").value = String(index);
        } finally {
          navigating = false;
          $("feedback").disabled = false;
          $("runSelect").disabled = false;
          $("prev").disabled = index === 0;
          $("next").disabled = index >= DATA.runs.length - 1;
          $("complete").disabled = !DATA.runs.length;
        }
      }
      $("feedback").addEventListener("input", () => {
        capture();
        clearTimeout(timer);
        timer = setTimeout(() => persist().catch(() => {}), 500);
      });
      $("prev").onclick = () => navigate(index - 1);
      $("next").onclick = () => navigate(index + 1);
      $("runSelect").onchange = (event) => navigate(Number(event.target.value));
      DATA.runs.forEach((run, i) => {
        const option = el("option", run.id, $("runSelect"));
        option.value = String(i);
      });
      $("save").onclick = () => persist().catch(() => {});
      $("download").onclick = () => {
        capture();
        download(snapshot(), "feedback.json");
      };
      $("complete").onclick = async () => {
        capture();
        if (DATA.runs.some((run) => !reviews.get(run.id).visited)) {
          alert("Visit every run before finishing. Unvisited runs are not approvals.");
          return;
        }
        status = "complete";
        try {
          await persist();
          if (DATA.static) download(snapshot(), "feedback.json");
          $("done").hidden = false;
        } catch {
          download(snapshot(), "feedback.json");
        }
      };
      $("reviewTab").onclick = () => {
        $("review").hidden = false;
        $("benchmark").hidden = true;
      };
      $("benchmarkTab").onclick = () => {
        $("review").hidden = true;
        $("benchmark").hidden = false;
      };
      function benchmark() {
        const parent = $("benchmark"),
          b = DATA.benchmark;
        if (!b) {
          el("p", "No benchmark.json available.", parent);
          return;
        }
        el("h2", "Benchmark", parent);
        el(
          "p",
          `Primary: ${b.metadata.primary} · Baseline: ${b.metadata.baseline}. Delta = primary − baseline. Missing measurements are shown as —.`,
          parent,
        );
        const metrics = ["pass_rate", "time_seconds", "tokens", "cost_usd"];
        const table = el("table", undefined, parent);
        const header = el("tr", undefined, table);
        ["Configuration", "Pass rate", "Time (s)", "Tokens", "Cost (USD)"].forEach((s) =>
          el("th", s, header),
        );
        for (const [config, stats] of Object.entries(b.run_summary)) {
          const row = el("tr", undefined, table);
          el("th", config, row);
          metrics.forEach((m) => {
            const value = stats[m];
            el(
              "td",
              config === "delta"
                ? fmt(value)
                : value?.mean === null || value?.mean === undefined
                  ? "—"
                  : `${value.mean} ± ${value.stddev} (n=${value.n})`,
              row,
            );
          });
        }
        el("h3", "Per-eval runs", parent);
        const runs = el("table", undefined, parent);
        const rh = el("tr", undefined, runs);
        ["Run", "Eval", "Pass rate", "Time (s)", "Tokens", "Cost (USD)", "Outcome"].forEach((s) =>
          el("th", s, rh),
        );
        for (const run of b.runs || []) {
          const row = el("tr", undefined, runs);
          [
            run.run_id,
            run.eval_name,
            ...metrics.map((m) => run.result[m]),
            run.result.outcome,
          ].forEach((v) => el("td", fmt(v), row));
          for (const note of run.notes || []) el("p", `${run.run_id}: ${note}`, parent);
        }
        el("h3", "Analyst notes", parent);
        for (const note of b.notes || []) el("p", note, parent);
      }
      window.addEventListener("beforeunload", (event) => {
        if (timer) {
          capture();
          event.preventDefault();
          event.returnValue = "";
        }
      });
      benchmark();
      render();
      if (DATA.runs.length) persist().catch(() => {});
    </script>
  </body>
</html>
